# cuda-dev (dev/lab image): rootless container storage for the SSH user on the persist
# ext4 (not on the /var overlay), the toolkit image archive, and the user's workspace on
# /var (persistent, exec allowed; /home is noexec).
d /run/trackc/persist/containers/trackc 0700 trackc trackc -
d /run/trackc/persist/images            0755 root   root   -
d /var/lib/cuda-work                    0755 root   root   -
d /var/lib/cuda-work/trackc             0755 trackc trackc -
