# The dGPU is driven by the NVIDIA open kernel module; keep nouveau away from it.
blacklist nouveau
options nouveau modeset=0
# Compute only: the laptop panel is wired to the iGPU. With modeset/fbdev on, nvidia-drm
# takes over the console framebuffer (efifb) and the screen goes blank. CUDA needs neither.
options nvidia-drm modeset=0 fbdev=0
